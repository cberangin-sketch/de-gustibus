<article class="post-card">
  <p class="post-card__meta">{% if post.category %}{{ post.category }} · {% endif %}{{ post.date | date: "%d.%m.%Y" }}</p>
  <h2 class="post-card__title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  {% if post.excerpt %}<div class="post-card__excerpt">{{ post.excerpt | strip_html | truncatewords: 32 }}</div>{% endif %}
  <a class="post-card__link" href="{{ post.url | relative_url }}">Lire l’article →</a>
</article>
