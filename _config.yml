title: "de gustibus."
description: "Ici je parle un peu d'art"
url: "https://degustibus.fr"
baseurl: ""
lang: "fr"
timezone: "Europe/Paris"
markdown: kramdown
permalink: /:title/

collections:
  photographie:
    output: true
    permalink: /photographie/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: []
      image: ""

  - scope:
      path: ""
      type: photographie
    values:
      layout: photo
      image: ""

plugins:
  - jekyll-sitemap
