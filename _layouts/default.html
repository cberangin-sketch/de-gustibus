<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <header class="site-header">
    <a class="logo" href="{{ '/' | relative_url }}">{{ site.data.site.logo_text }}</a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="main-nav"
      aria-label="Ouvrir le menu">
      ☰
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Navigation principale">
      <a href="{{ '/' | relative_url }}">Accueil</a>
      <a href="{{ '/jeu-video/' | relative_url }}">Jeu vidéo</a>
      <a href="{{ '/films-et-series/' | relative_url }}">Films et Séries</a>
      <a href="{{ '/litterature/' | relative_url }}">Littérature</a>
      <a href="{{ '/divers/' | relative_url }}">Divers</a>
      <a href="{{ '/a-propos/' | relative_url }}">À propos</a>

      <button
        class="mobile-search-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="search-panel">
        Rechercher
      </button>

      <button
        class="search-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="search-panel"
        aria-label="Rechercher">
        ⌕
      </button>
    </nav>
  </header>

  <aside id="search-panel" class="search-panel" hidden>
    <form class="search-form" action="{{ '/recherche/' | relative_url }}" method="get">
      <label for="search-input">Rechercher dans les articles</label>

      <div class="search-row">
        <input
          id="search-input"
          name="q"
          type="search"
          placeholder="Titre, mot-clé, sujet…">

        <button type="submit">Chercher</button>
      </div>
    </form>
  </aside>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>de gustibus.</span>
    <span>Carnet culturel</span>
  </footer>

  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>

</body>
</html>
