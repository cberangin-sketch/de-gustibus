---
layout: default
title: Recherche
permalink: /recherche/
noindex: true
sitemap: false
---

<section class="search-results">

  <p class="eyebrow">Recherche</p>

  <h1>Rechercher</h1>

  <form
    id="full-search-form"
    class="search-form">

    <div class="search-row">

      <input
        id="full-search-input"
        name="q"
        type="search"
        placeholder="Titre, mot-clé, sujet…">

      <button type="submit">
        Chercher
      </button>

    </div>

  </form>

  <p
    id="search-summary"
    class="search-summary">
  </p>

  <div
    id="search-results-list"
    class="post-list">
  </div>

  <div
    id="search-empty"
    class="empty-state"
    hidden>

    <p>
      Aucun article ne correspond à votre recherche.
    </p>

  </div>

</section>

<script>
window.DE_GUSTIBUS_POSTS = [
  {% for post in site.posts %}
    {
      title: {{ post.title | jsonify }},
      url: {{ post.url | relative_url | jsonify }},
      category: {{ post.category | jsonify }},
      date: {{ post.date | date: "%Y-%m-%d" | jsonify }},
      tags: {{ post.tags | jsonify }},
      excerpt: {{ post.excerpt | strip_html | strip_newlines | truncate: 240 | jsonify }}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];
</script>
