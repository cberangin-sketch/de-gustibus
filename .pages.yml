media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Articles
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      fields: [title, date, category]

    fields:
      - name: title
        label: Titre
        type: string

      - name: date
        label: Date et heure
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"

      - name: category
        label: Catégorie
        type: select
        options:
          values:
            - value: jeu-video
              label: Jeu vidéo
            - value: films-et-series
              label: Films et Séries
            - value: litterature
              label: Littérature
            - value: divers
              label: Divers

      - name: chapeau
        label: Chapeau
        type: text

      - name: image
        label: Image de couverture
        type: image

      - name: tags
        label: Mots-clés
        type: string
        list: true

      - name: body
        label: Texte
        type: rich-text

  - name: photographie
    label: Photographie
    type: collection
    path: _photographie
    filename: "{year}-{month}-{day}-{primary}.md"

    fields:
      - name: title
        label: Titre
        type: string

      - name: date
        label: Date
        type: date

      - name: image
        label: Photographie
        type: image

      - name: location
        label: Lieu
        type: string

      - name: caption
        label: Légende
        type: text
